  川乌: 3.0
  草乌: 3.0
  马钱子: 0.6
  细辛: 3.0
  半夏: 9.0
  巴豆: 0.3
  甘遂: 1.5
  大戟: 3.0
  芫花: 1.5
  天南星: 9.0

